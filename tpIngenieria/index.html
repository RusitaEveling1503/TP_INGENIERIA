<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Título que se muestra en la pestaña del navegador -->
    <title>Sistema de Gestión y Seguimiento de Pericias</title>
    <!-- Hoja de estilos de Bootstrap para usar componentes y grillas responsivas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Hoja de estilos del proyecto-->
    <link href="style.css" rel="stylesheet"> 
    <style>
        /*Estilos generales de la página */
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        /*.sidebar (barra lateral de navegación) y sus estilos*/
        .sidebar {
            background: #1f3a5f;
            min-height: 100vh;
            color: white;
        }

        /*.sidebar  a (enlaces que están dentro de la barra lateral de navegación) y sus estilos*/
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        /* Efecto visual al pasar el mouse sobre los enlaces que se encuentran en la barra lateral */
        .sidebar a:hover {
            background: #294b75;
        }

        /* Estilos del encabezado de los bloques de contenido */
        .card-header {
            background: #0d6efd;
            color: white;
            font-weight: 600;
        }

        /* Estilos de la barra superior con el título y datos del usuario*/
        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #dfe3e8;
            padding: 16px 20px;
            margin-bottom: 24px;
            border-radius: 10px;
        }

        /*Estilos del título principal dentro de la barra superior*/
        .topbar h1 {
            margin: 0;
            font-size: 2rem;
        }

        /* Estilos del contenedor que agrupa la información del usuario y sus botones */
        .user-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        /* Estilos de la lista de enlaces horizontales o de navegación secundaria*/
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }

        /* Enlaces de navegación secundaria dentro del contenedor .nav-links */
        .nav-links a {
            color: #1f3a5f;
            text-decoration: none;
            font-weight: 600;
        }

        /* Efecto visual al pasar el mouse sobre los enlaces de navegación secundaria*/
        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Estilo de formulario de búsqueda con separación entre campos */
        .search-form .row > div {
            margin-bottom: 15px;
        }


        /* Estilos de las etiquetas de los campos dentro del formulario de búsqueda */
        .search-form label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        /* Estilo de las tablas */
        .table th {
            background-color: #edf2ff;
        }

        /*Estilos del contenedor que organiza los botones de acción de separación*/
        .btn-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!--Contenedr principal del sistema-->
    <div class="container-fluid">
        <div class="row">
            <!--Barra lateral de navegación-->
            <aside class="col-md-2 sidebar p-3">
                <h4>JustiData</h4>
                <hr>
                <!-- Enlaces para movimiento entre secciones de la misma página -->
                <a href="">Inicio</a>
                <a href="Informes.html">Cargar pericia</a>
                <a href="Busqueda.html">Buscador</a>
                <a href="Busqueda.html">Informe</a>
                
            </aside>

            <!--Área principal de contenido-->
            <main class="col-md-10 p-4">
                <header class="topbar">
                    <h1 id="inicio">Sistema de Gestión y Seguimiento de Pericias</h1>

                   <!-- <nav aria-label="Menú principal" class="nav-links">
                        <a href="inicio.html">Inicio</a>
                        <a href="carga_pericia.html">Carga de pericia</a>
                        <a href="busqueda_pericias.html">Búsqueda de pericias</a>
                        <a href="informes.html">Informes</a>
                    </nav>  -->

                    <!--Bloque con información del usuario y botones de acción-->
                    <div class="user-box">
                        <p class="mb-0">Usuario: Operador administrativo</p>
                        <div class="btn-actions">
                            <a href="Registro.html" class="btn btn-sm btn-outline-primary">Registrar usuario</a>
                            <a href="Login.html" class="btn btn-sm btn-primary">Iniciar sesión</a>
                        </div>
                    </div>
                </header>

                <p class="mb-4">Basado en el DER y Modelo Relacional del Trabajo Práctico.</p>
            </main>
        </div>
    </div>
</body>
</html>
