<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Registro de usuario | JustiData</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <!--Estilos propios de este "apartado" Registro de uduario-->
    <style>
        body { background: #f4f6f9; font-family: Arial, sans-serif; }
        .card-header { background: #0d6efd; color: #fff; font-weight: 600; }
        .topbar { margin-bottom: 24px; padding: 16px 20px; border-bottom: 1px solid #dfe3e8; border-radius: 10px; background: #fff; }
        .user-box { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .form-card { max-width: 760px; margin: 0 auto; }
    </style>
</head>
<body>
    <!--Contenedor principal del Sistema de Gestión y Seguimiento de Pericias-->
    <div class="container-fluid">
        <div class="row">
            <main class="col-12 p-4">
                <header class="topbar">
                    <!--Encabezado y contenedor para registro de usuario-->
                    <h1 class="h2 mb-0">Sistema de Gestión y Seguimiento de Pericias</h1>
                    <div class="user-box">
                        <p class="mb-0">Registro de usuario</p>
                        <!--Enlace para volver a la página de inicio-->
                        <a href="index.html" class="btn btn-sm btn-outline-primary">Volver al inicio</a>
                    </div>
                </header>
                <!--Sección para la creación de cuenta en el Sistema-->
                <section class="card form-card">
                    <div class="card-header">Crear cuenta</div>
                    <div class="card-body">
                        <form action="#" method="post">
                            <!--Contenedor para el nombre completo en el registro-->
                            <div class="mb-3">
                                <label for="registroNombre" class="form-label">Nombre completo</label>
                                <input type="text" id="registroNombre" name="name" class="form-control" autocomplete="name" required>
                            </div>
                            <!--Contenedor para el nombre de usuario en el registro-->
                            <div class="mb-3">
                                <label for="registroUsuario" class="form-label">Nombre de usuario</label>
                                <input type="text" id="registroUsuario" name="username" class="form-control" autocomplete="username" required>
                            </div>
                            <!--Contenedor para el número de teléfono en el registro-->
                            <div class="mb-3">
                                <label for="registroTelefono" class="form-label">Número de teléfono</label>
                                <input type="tel" id="registroTelefono" name="telefono" class="form-control" autocomplete="tel" inputmode="tel" required>
                            </div>
                            <!--Contenedor para el correo electrónico de usuario en el registro-->
                            <div class="mb-3">
                                <label for="registroEmail" class="form-label">Correo electrónico</label>
                                <input type="email" id="registroEmail" name="email" class="form-control" autocomplete="email" required>
                            </div>
                            <!--Contenedor para la cntrasea de usuario-->
                            <div class="mb-3">
                                <label for="registroPassword" class="form-label">Contraseña</label>
                                <input type="password" id="registroPassword" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
                                <div class="form-text">Debe tener al menos 8 caracteres.</div>
                            </div>
                            
                            <!--Botón que envía los datos del formulario de registro-->
                            <button type="submit" class="btn btn-success">Registrarme</button>
                        </form>
                        <!--Enlace para usuarios que no tienen cuenta, e inicio de sesión para usuarios ya registrados-->
                        <p class="mt-3 mb-0">¿Ya tienes una cuenta? <a href="Login.html">Inicia sesión</a>.</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
