<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | JustiData</title>
    <!--Bootstrap para estilos visuaes-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Estilos css del proyecto-->
    <link href="style.css" rel="stylesheet">
    <!--Estilos aplicados al "apartado" de inicio de sesión en el sistema JustiData-->
    <style>
        body { background: #f4f6f9; font-family: Arial, sans-serif; }
        .card-header { background: #0d6efd; color: #fff; font-weight: 600; }
        .topbar { margin-bottom: 24px; padding: 16px 20px; border-bottom: 1px solid #dfe3e8; border-radius: 10px; background: #fff; }
        .user-box { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .form-card { max-width: 760px; margin: 0 auto; }
    </style>
</head>
<body>
    <!--Contenedor principal de la página-->
    <div class="container-fluid">
        <div class="row">
            <main class="col-12 p-4">
                <!--Encabezado superior-->
                <header class="topbar">
                    <h1 class="h2 mb-0">Sistema de Gestión y Seguimiento de Pericias</h1>
                    <div class="user-box">
                        <p class="mb-0">Acceso de usuario</p>
                        <a href="index.html" class="btn btn-sm btn-outline-primary">Volver al inicio</a>
                    </div>
                </header>

                <!--Sección del formulario de login-->
                <section class="card form-card">
                    <div class="card-header">Iniciar sesión</div>
                    <div class="card-body">
                        <!--Formulario de acceso-->
                        <form action="#" method="post">
                            <div class="mb-3">
                                <label for="loginUsuario" class="form-label">Usuario</label>
                                <input type="text" id="loginUsuario" name="usuario" class="form-control" autocomplete="username" required>
                            </div>
                            <!--Contenedor para el correo electrónico de usuario-->
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Correo electrónico</label>
                                <input type="email" id="loginEmail" name="email" class="form-control" autocomplete="email" required>
                            </div>
                            <!--Contenedor para la contraseña de usuario-->
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Contraseña</label>
                                <input type="password" id="loginPassword" name="password" class="form-control" autocomplete="current-password" required>
                            </div>
                            <!--Botón de envío-->
                            <button type="submit" class="btn btn-primary">Ingresar</button>
                        </form>
                        <!--Enlace para los usuarios que no tienen cuenta-->
                        <p class="mt-3 mb-0">¿No tienes cuenta? <a href="Registro.html">Regístrate</a>.</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
